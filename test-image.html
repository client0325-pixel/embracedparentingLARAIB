<!DOCTYPE html>
<html>
<head>
  <title>Test Image Load</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }
    .test-container {
      width: 300px;
      height: 400px;
      background: white;
      border: 2px solid red;
      margin: 20px 0;
      overflow: hidden;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .test-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    h2 {
      margin-top: 40px;
      color: #333;
    }
    .status {
      font-size: 14px;
      color: #666;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h1>Image Load Test</h1>
  
  <h2>Test 1: Relative Path (images/about.jpeg)</h2>
  <div class="status">If the image loads below with red border, the path is correct.</div>
  <div class="test-container">
    <img src="images/about.jpeg" alt="Test image from images folder">
  </div>

  <h2>Test 2: Absolute Path</h2>
  <div class="status">If this image loads, absolute path works.</div>
  <div class="test-container">
    <img src="/Users/mac/Downloads/embracedparenting-aarim/images/about.jpeg" alt="Absolute path">
  </div>

  <h2>Test 3: Image Info</h2>
  <div class="status" id="img-info">Checking image...</div>
  
  <script>
    const img = document.querySelector('h2:nth-of-type(1) + .status + .test-container img');
    img.onload = function() {
      document.getElementById('img-info').innerHTML = '✓ Image loaded successfully! Dimensions: ' + this.naturalWidth + 'x' + this.naturalHeight;
    };
    img.onerror = function() {
      document.getElementById('img-info').innerHTML = '✗ Image failed to load. Path may be incorrect.';
    };
  </script>
</body>
</html>
